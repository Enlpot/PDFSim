# 发版：打 v* 标签时自动测试 + 打包 + 发布 GitHub Release
# 用法：git tag v0.1.0 && git push origin v0.1.0
name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8  # Windows runner 默认 cp1252，避免中文输出崩溃
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史，用于生成 release notes

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Generate test samples
        run: python src/tests/samples/gen_samples.py

      - name: Run tests
        run: python -m pytest src/tests -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build selftest & verify (功能不变验证)
        run: |
          python -m PyInstaller --clean --noconfirm PDFSim_selftest.spec
          ./dist/PDFSim_selftest.exe || { echo "::error::selftest 失败"; exit 1; }
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Inject version from tag
        # 把 tag 版本写入 __init__.py（如 v0.1.0 → __version__="0.1.0"），
        # 使 exe 内"关于"页面版本与 Release 版本一致
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          sed -i "s/__version__ = \".*\"/__version__ = \"$VER\"/" src/pdfsim/__init__.py
          echo "== 注入后版本 =="; grep -n "__version__" src/pdfsim/__init__.py
        shell: bash

      - name: Build PDFSim.exe
        run: python build.py
        shell: bash

      - name: Rename exe with version
        run: |
          cp "dist/PDFSim.exe" "dist/PDFSim-${{ github.ref_name }}.exe"
          ls -la dist/ | grep -i exe
        shell: bash

      - name: Generate 使用说明书 PDF
        # 用 windows 平台（runner 有桌面会话，offscreen 下 Qt 找不到字体，中文无法渲染）
        run: python scripts/md2pdf.py "docs/使用说明书.md" "docs/使用说明书.pdf"
        env:
          QT_QPA_PLATFORM: windows

      - name: Compute SHA-256
        run: python -c "import hashlib;print(hashlib.sha256(open('dist/PDFSim-${{ github.ref_name }}.exe','rb').read()).hexdigest())" > "dist/PDFSim-${{ github.ref_name }}.exe.sha256"
        shell: bash

      - name: Prepare release notes
        run: |
          PREV=$(git tag --sort=-v:refname | sed -n '2p')
          {
            echo "## 功能"
            echo "- PDF 双面打印页码编排与装订准备"
            echo "- 自动识别封面/签字/目录/正文，空白页管理，旋转校正"
            echo "- 页码位置/样式/多选批量，缩略图双列，书视图预览"
            echo ""
            echo "## 本版变更"
            if [ -n "$PREV" ]; then git log "$PREV..HEAD" --oneline --no-decorate; else git log --oneline --no-decorate; fi
            echo ""
            echo "## 校验"
            echo "- 全量测试：pytest src/tests 通过"
            echo "- 打包自检（PDFSim_selftest）：核心功能逐项验证通过"
            echo "- SHA-256 见附件 PDFSim-${{ github.ref_name }}.exe.sha256"
            echo "- 使用说明书见附件 PDFSim使用说明书.pdf"
          } > notes.md
          cat notes.md
        shell: bash

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "docs/使用说明书.pdf" "dist/PDFSim使用说明书.pdf"
          EXE="dist/PDFSim-${{ github.ref_name }}.exe"
          gh release create "${{ github.ref_name }}" "$EXE" "$EXE.sha256" "dist/PDFSim使用说明书.pdf" \
            --title "PDFSim ${{ github.ref_name }}" \
            --notes-file notes.md
        shell: bash
