# 持续集成：push 到 main 或提 PR 时自动跑全量测试
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8  # Windows runner 默认 cp1252，避免中文输出崩溃
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov

      - name: Generate test samples
        # 大性能样本（sample_800pages.pdf）不入库，CI 前先全量生成
        run: python src/tests/samples/gen_samples.py

      - name: Run tests
        run: python -m pytest src/tests -q
        env:
          QT_QPA_PLATFORM: offscreen
